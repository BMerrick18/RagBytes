name: Deploy steps (shared, used by CI and Deploy to production)

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment to record the deployment against.
        type: string
        required: true
      stack:
        description: Stack on the Droplet, prod or dev.
        type: string
        required: true
      url:
        description: Public URL of the stack, used for the smoke test.
        type: string
        required: true
      api_url:
        description: Public URL of the stack's API.
        type: string
        required: true
      image_tag:
        description: Full commit SHA whose images to release.
        type: string
        required: true

permissions:
  contents: read
  packages: read

env:
  IMAGE_PREFIX: ghcr.io/bmerrick18/ragbytes

jobs:
  deploy:
    name: Release ${{ inputs.stack }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.url }}
    concurrency:
      group: deploy-${{ inputs.stack }}
      cancel-in-progress: false
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      FIREWALL_NAME: ragbyte
      STACK: ${{ inputs.stack }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      SITE_URL: ${{ inputs.url }}
      API_URL: ${{ inputs.api_url }}
    steps:
      - name: Check image tag
        run: '[[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::image_tag must be a full 40-character commit SHA"; exit 1; }'

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.image_tag }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check images exist
        run: |
          for service in api web; do
            docker buildx imagetools inspect "$IMAGE_PREFIX-$service:$IMAGE_TAG" > /dev/null || {
              echo "::error::No $service image for $IMAGE_TAG. Wait for CI on main to finish building it."
              exit 1
            }
          done

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}

      - name: Open SSH for this runner
        id: firewall
        run: |
          ip=$(curl -fsS https://api.ipify.org)
          id=$(doctl compute firewall list --format ID,Name --no-header | awk -v n="$FIREWALL_NAME" '$2 == n {print $1}')
          [ -n "$id" ] || { echo "::error::Firewall $FIREWALL_NAME not found"; exit 1; }
          doctl compute firewall add-rules "$id" --inbound-rules "protocol:tcp,ports:22,address:$ip/32"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "ip=$ip" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          for i in $(seq 1 20); do
            ssh -o BatchMode=yes -o ConnectTimeout=5 "root@$HOST" true && exit 0
            sleep 3
          done
          echo "::error::SSH did not become reachable"; exit 1

      - name: Release
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          ssh -o BatchMode=yes "root@$HOST" "mkdir -p /opt/ragbyte/edge /opt/ragbyte/$STACK"
          scp -o BatchMode=yes docker-compose.yml "root@$HOST:/opt/ragbyte/$STACK/docker-compose.yml"
          scp -o BatchMode=yes deploy/edge/compose.yml deploy/edge/Caddyfile "root@$HOST:/opt/ragbyte/edge/"
          scp -o BatchMode=yes deploy/release.sh "root@$HOST:/opt/ragbyte/release.sh"
          printf '%s' "$REGISTRY_TOKEN" | ssh -o BatchMode=yes "root@$HOST" \
            "bash /opt/ragbyte/release.sh '$STACK' '$IMAGE_TAG' '$REGISTRY_USER' '$API_URL'"

      - name: Smoke test
        run: |
          health=$(curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "$SITE_URL/api/health")
          echo "$health"
          for part in web api; do
            [ "$(jq -r ".$part" <<< "$health")" = "$IMAGE_TAG" ] || {
              echo "::error::$SITE_URL is not running $IMAGE_TAG for $part"
              exit 1
            }
          done
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors -o /dev/null "$SITE_URL/"
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors -o /dev/null "$SITE_URL/docs"
          printf '# Smoke test\n\nRagBytes deploy check.\n' > smoke.md
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors \
            -F file=@smoke.md -F method=structured "$SITE_URL/api/chunks" | grep -q '"chunks"'

          [ "$(curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "$API_URL/health" | jq -r .version)" = "$IMAGE_TAG" ] || {
            echo "::error::$API_URL is not running $IMAGE_TAG"
            exit 1
          }
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "$API_URL/openapi.json" | jq -e '.paths["/v1/chunk/structured"]' > /dev/null
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors -o /dev/null "$API_URL/docs"
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors \
            -F file=@smoke.md "$API_URL/v1/chunk/structured" | grep -q '"chunks"'
          # The two uploads above are counted, so a zero here means the stats volume isn't writable.
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "$API_URL/v1/stats" | jq -e '.documents > 0' > /dev/null

      - name: Close SSH
        if: ${{ always() && steps.firewall.outputs.id != '' }}
        run: |
          doctl compute firewall remove-rules "${{ steps.firewall.outputs.id }}" \
            --inbound-rules "protocol:tcp,ports:22,address:${{ steps.firewall.outputs.ip }}/32"
