[project]
name = "shark-byte"
version = "0.1.0"
description = "Service that turns uploaded files into text chunks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4",
    "fastapi",
    "pdfminer.six",
    "pdfplumber",
    "pydantic-settings",
    "pypdfium2",
    "python-docx",
    "python-multipart",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "pytest",
    "reportlab",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shark_byte"]

[tool.pytest.ini_options]
testpaths = ["tests"]
